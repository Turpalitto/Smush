[preset.0]

name="Android Debug APK"
platform="Android"
runnable=true
dedicated_server=false
custom_features="mobile"
export_filter="all_resources"
include_filter="*.json,*.png,*.wav,*.ttf,licenses/*.txt,addons/GodotGooglePlayBilling/LICENSE,resources/fonts/LICENSE-DejaVu.txt"
exclude_filter="tests/*,tools/*,web/*,android/*,src/*,package.json,tsconfig.json,drizzle.config.json"
export_path="builds/android/slime-rush-debug.apk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
gradle_build/use_gradle_build=true
gradle_build/export_format=0
gradle_build/min_sdk="24"
gradle_build/target_sdk="36"
architectures/armeabi-v7a=true
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=true
package/unique_name="com.turpalitto.slimerush"
package/name="Slime Rush: Evolution"
package/signed=true
package/app_category=0
version/code=1
version/name="1.0.0"
launcher_icons/main_192x192="res://resources/branding/icon.png"
launcher_icons/adaptive_foreground_432x432="res://resources/branding/icon_foreground.png"
launcher_icons/adaptive_background_432x432="res://resources/branding/icon_background.png"
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
permissions/internet=true
permissions/vibrate=true

