name: Android CI & Release Candidate Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

jobs:
  qa-and-android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17 (JDK for Godot 4.5 Gradle Android build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK (API 35)
        uses: android-actions/setup-android@v3

      - name: Install Godot 4.5-stable & Export Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_export_templates.tpz
          unzip -q Godot_v4.5-stable_linux.x86_64.zip
          sudo mv Godot_v4.5-stable_linux.x86_64 /usr/local/bin/godot4
          mkdir -p ~/.local/share/godot/export_templates/4.5.stable
          unzip -q Godot_v4.5-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/4.5.stable/

      - name: Fetch Official Google Play Billing 3.3.0 AAR
        run: |
          wget -q https://github.com/godot-sdk-integrations/godot-google-play-billing/releases/download/3.3.0/GodotGooglePlayBilling.3.3.0.zip -O /tmp/billing.zip || true
          if [ -f /tmp/billing.zip ]; then unzip -qo /tmp/billing.zip -d addons/; fi

      - name: Run Automated GDScript Test Suite
        run: |
          python3 tools/sync_godot_cache.py
          godot4 --headless --quit-after 600 --path . res://tests/TestRunner.tscn

      - name: Import Project & Export Debug APK
        run: |
          mkdir -p builds/android
          godot4 --headless --editor --quit --path .
          godot4 --headless --path . --export-debug "Android Debug APK" builds/android/slime-rush-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: slime-rush-debug-apk
          path: builds/android/slime-rush-debug.apk
